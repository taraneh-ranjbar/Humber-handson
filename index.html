
<script>
    function validateForm() {

        var name = document.getElementById("name").value;
        var email = document.getElementById("email").value;
        var message = document.getElementById("message").value;

        document.getElementById("nameError").innerText = "";
        document.getElementById("emailError").innerText = "";
        document.getElementById("messageError").innerText = "";

        var isValid = true;

        if (name == "") {
            document.getElementById("nameError").innerText = "Please enter your name";
            isValid = false;
        }

        if (email == "") {
            document.getElementById("emailError").innerText = "Please enter your email";
            isValid = false;
        }

        if (message == "") {
            document.getElementById("messageError").innerText = "Please enter a message";
            isValid = false;
        }

        return isValid;
    }
</script>


<!DOCTYPE html>
<html lang="en">
    <head>
       <meta charset="UTF-8">
      <title>Landing Page - Sara</title>
        <style>
            body {
                font-family: Arial, sans-serif;
                background-color: #f5f5f5;
            }

            section {
                width: 300px;
                margin: 50px auto;
                padding: 20px;
                background-color: white;
                border: 1px solid #ddd;
            }

            h2 {
                text-align: center;
            }

            label {
                display: block;
                margin-top: 10px;
            }

            input, textarea {
                width: 100%;
                padding: 6px;
                margin-top: 5px;
                border: 1px solid #ccc;
            }

            button {
                margin-top: 15px;
                padding: 8px;
                width: 100%;
                background-color: #333;
                color: white;
                border: none;
            }
        </style>
    </head>
    <body>
<header>
    <h1>Hello World</h1>
    <p>Sara Ranjbar</p>
</header>
<main>
    <img src="https://via.placeholder.com/300" alt="Profile picture of Sara Ranjbar">
    <section>
        <h2>Contact Me</h2>

        <form onsubmit="return validateForm()">

            <label for="name">Name:</label><br>
            <input type="text" id="name"><br>
            <span id="nameError" style="color:red;"></span>

            <br><br>

            <label for="email">Email:</label><br>
            <input type="text" id="email"><br>
            <span id="emailError" style="color:red;"></span>

            <br><br>

            <label for="message">Message:</label><br>
            <textarea id="message"></textarea><br>
            <span id="messageError" style="color:red;"></span>

            <br><br>

            <button type="submit">Send</button>

        </form>

    </section>

</main>
</body>
</html>
