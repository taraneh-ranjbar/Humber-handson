<!DOCTYPE html>
<html lang="en">
    <head>
       <meta charset="UTF-8">
      <title>Landing Page - Sara</title>
    </head>
    <body>
<header>
    <h1>Hello World</h1>
    <p>Sara Ranjbar</p>
</header>
<main>

    <section>
        <h2>Contact Me</h2>
        <form>
            <label for="name">FullName:</label>

            <br><br>

        </form>

    </section>

</main>
</body>
</html>
