
<script>
    function validateForm() {

        var name = document.getElementById("name").value;
        var email = document.getElementById("email").value;
        var message = document.getElementById("message").value;

        document.getElementById("nameError").innerText = "";
        document.getElementById("emailError").innerText = "";
        document.getElementById("messageError").innerText = "";

        var isValid = true;

        if (name == "") {
            document.getElementById("nameError").innerText = "Please enter your name";
            isValid = false;
        }

        if (email == "") {
            document.getElementById("emailError").innerText = "Please enter your email";
            isValid = false;
        }

        if (message == "") {
            document.getElementById("messageError").innerText = "Please enter a message";
            isValid = false;
        }

        return isValid;
    }
</script>


<!DOCTYPE html>
<html lang="en">
    <head>
       <meta charset="UTF-8">
      <title>Landing Page - Sara</title>
        <style>
            body {
                font-family: Arial, sans-serif;
                margin: 0;
                background-color: #f4f6f8;
                text-align: center;
            }

            header {
                background-color: #2c6ed5;
                color: white;
                padding: 30px;
            }

            main {
                padding: 40px;
            }

            img {
                width: 200px;
                border-radius: 50%;
                margin-bottom: 20px;
            }

            section {
                background: white;
                padding: 25px;
                margin: 20px auto;
                width: 350px;
                border-radius: 8px;
                box-shadow: 0 0 10px rgba(0,0,0,0.1);
            }

            label {
                display: block;
                text-align: left;
                margin-top: 15px;
            }

            input, textarea {
                width: 100%;
                padding: 8px;
                margin-top: 5px;
                border: 1px solid #ccc;
                border-radius: 4px;
            }

            textarea {
                resize: none;
                height: 80px;
            }

            button {
                margin-top: 15px;
                padding: 10px;
                background-color: #2c6ed5;
                color: white;
                border: none;
                border-radius: 4px;
                cursor: pointer;
            }

            button:hover {
                background-color: #1e4fa3;
            }

            .error {
                color: red;
                font-size: 12px;
                text-align: left;
            }
        </style>
    </head>
    <body>
<header>
    <h1>Hello World</h1>
    <p>Sara Ranjbar</p>
</header>
<main>
    <img src="https://via.placeholder.com/300" alt="Profile picture of Sara Ranjbar">
    <section>
        <h2>Contact Me</h2>

        <form onsubmit="return validateForm()">

            <label for="name">Name:</label><br>
            <input type="text" id="name"><br>
            <span id="nameError" style="color:red;"></span>

            <br><br>

            <label for="email">Email:</label><br>
            <input type="text" id="email"><br>
            <span id="emailError" style="color:red;"></span>

            <br><br>

            <label for="message">Message:</label><br>
            <textarea id="message"></textarea><br>
            <span id="messageError" style="color:red;"></span>

            <br><br>

            <button type="submit">Send</button>

        </form>

    </section>

</main>
</body>
</html>
